# AG-Mamba 交付配置（论文所提方法的默认设置）
# 说明：本文件是 run_cell.py --method AGMamba 的默认配置；实验驱动
#       experiments/run_stage.py 会在此基础上按臂覆盖（见 experiments/arms/arms.json）。
#       协议与口径见 docs/PROTOCOL.md。
dataset_type: bearing
use_cuda: True
device: cpu
data_length: 1024
batch_size: 64
num_classes: 14
steps: 2880              # 交付预算：2,880 步 + 余弦退火（steps_override 亦可指定）
checkpoint_freq: 1
lr: 0.001
use_domain_weight: False
use_scheduler: True      # 余弦退火至零

# --- 训练目标（干净版）：L = CE + w_delta * ||Delta||_2^2 ---
# 无域对齐头：w_mmd = w_adv = 0 -> 域判别器不构建、MMD/JMMD/CDAN 不计算
#   消融依据：docs/manuscript/_s64_align_data.md（last10 口径 +8.63，p=0.0023，13/15）
w_mmd: 0.0               # 源域两两 MMD（已移除）
w_adv: 0.0               # GRL 域判别（已移除）
w_delta: 0.01

# --- 前端：受控混叠 Gabor 滤波器组（G1）---
front_mode: gaborwide
front_init: gabor
front_chan: 512
front_ksize: 128
front_stride: 4
gabor_f_lo: 0.0025
gabor_f_hi: 0.45
gabor_dc_frac: 0.3
gabor_alias: 2.0
gabor_sigma: 0.5
wave_init: False

# --- 主干：选择性状态空间（标准 Mamba 式选择性 Δ）---
use_ssm: True
n_blocks: 3
d_model: 128
d_inner: 128
n_state: 8
tau_mode: zero           # 无液体项：τ₀ 估计器与 γ·τ₀ 调制整条不构建
                         # （use_tau=False；Δ 退化为标准 Mamba 选择性步长）

# --- 液体 τ₀ 通路（保留代码，交付配置下**不构建任何参数/不做 FFT**） ---
gamma_init: 0.1
a_lo: 0.5
a_hi: 3.0
tau_min_lag: 8
tau_max_lag: 300
tau_temp: 0.05
tau_estimator: autocorr
tau_proj: False
detach_tau: False

# --- 读出与其它 ---
use_pos_embed: True
head_dropout: 0.3
ssm_mode: single
ms_d_inner: 64
use_impact: false
impact_temp: 1.0
ema_decay: 0.0
ema_start: 100
